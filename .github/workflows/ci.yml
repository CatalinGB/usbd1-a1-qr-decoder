name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run tests
        run: npm test
      - name: Check decoder.html and index.html are in sync with src/
        run: |
          npm run build
          git diff --exit-code decoder.html index.html
